<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aloy Vaani</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="logo">
                <div class="logo-icon">🎙️</div>
                <div>
                    <h1>Aloy Vaani</h1>
                    <p>One voice. Many languages.</p>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                AI Translator
            </div>
        </header>

        <main class="main">

            <section class="hero">
                <span class="badge">✨ AI POWERED TRANSLATION</span>

                <h2>Speak freely.<br>
                    <span>Connect globally.</span>
                </h2>

                <p>
                    Translate your words between English, Hindi and Kannada
                    with the power of Aloy Vaani.
                </p>
            </section>

            <section class="translator-card">

                <div class="language-row">

                    <div class="language-box">
                        <label>FROM</label>
                        <select id="sourceLanguage">
                            <option value="en">English</option>
                            <option value="hi">Hindi</option>
                            <option value="kn">Kannada</option>
                        </select>
                    </div>

                    <button id="swapBtn" class="swap-btn" type="button">
                        ⇄
                    </button>

                    <div class="language-box">
                        <label>TO</label>
                        <select id="targetLanguage">
                            <option value="hi">Hindi</option>
                            <option value="en">English</option>
                            <option value="kn">Kannada</option>
                        </select>
                    </div>

                </div>

                <div class="text-area-container">

                    <div class="input-section">
                        <label>Your message</label>

                        <textarea
                            id="inputText"
                            placeholder="Type something to translate..."
                        ></textarea>

                        <div class="input-bottom">
                            <span id="charCount">0 characters</span>

                            <button id="micBtn" class="mic-btn" type="button">
                                🎙️
                            </button>
                        </div>
                    </div>

                    <div class="output-section">
                        <label>Translation</label>

                        <div id="outputText" class="output-text">
                            Your translation will appear here...
                        </div>

                        <button id="copyBtn" class="copy-btn" type="button">
                            📋 Copy
                        </button>
                    </div>

                </div>

                <button id="translateBtn" class="translate-btn" type="button">
                    <span>Translate</span>
                    <span>→</span>
                </button>

                <p id="statusMessage" class="status-message"></p>

            </section>

        </main>

        <footer class="footer">
            <p>Made by <strong>PCMC 1PU Batch 10</strong></p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
